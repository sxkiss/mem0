services:
  mem0:
    build: .
    image: sxkiss/mem0:latest
    container_name: mem0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/history:/app/history
      - ./data/logs:/app/logs
    env_file:
      - .env

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mem0-postgres
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/pgvector:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
