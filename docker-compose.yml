services:
  mem0:
    build: .
    image: sxkiss/mem0:latest
    container_name: mem0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/history:/app/history
      - ./data/logs:/app/logs
    environment:
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - APP_DB_NAME=mem0_app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - HISTORY_DB_PATH=/app/history/history.db
      - OPENAI_API_KEY=PROXY_MANAGED
      - OPENAI_BASE_URL=http://127.0.0.1:5001/v1
      - MEM0_DEFAULT_LLM_MODEL=mimo-v2.5-free
      - MEM0_DEFAULT_EMBEDDER_MODEL=text-embedding-3-small
      - AUTH_DISABLED=true

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mem0-postgres
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/pgvector:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
